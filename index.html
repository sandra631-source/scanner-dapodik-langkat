
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner DAPODIK Langkat 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 25px auto;
      padding: 16px;
      background: #f3f6f4;
      color: #203328;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    h2 { color: #17643b; }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px 3px 5px 0;
    }
    #start { background: #17643b; color: white; }
    #stop { background: #b42318; color: white; }
    video {
      width: 100%;
      background: #222;
      border-radius: 8px;
      margin-top: 12px;
    }
    #status, #hasil {
      padding: 12px;
      background: #f3f6f4;
      border-radius: 7px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Scanner Absensi</h2>
    <p>Sosialisasi DAPODIK Kabupaten Langkat 2026</p>

    <button id="start">Aktifkan Kamera</button>
    <button id="stop">Matikan Kamera</button>

    <p id="status">Scanner belum diaktifkan.</p>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <h3>Hasil Pembacaan QR</h3>
    <div id="hasil">Belum ada QR yang dibaca.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', {
      willReadFrequently: true
    });
    const status = document.getElementById('status');
    const hasil = document.getElementById('hasil');

    let stream = null;
    let aktif = false;
    let sedangMemproses = false;
    let qrTerakhir = '';

    document.getElementById('start').onclick = async function () {
      try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            'Browser tidak mendukung akses kamera.'
          );
        }

        if (typeof jsQR !== 'function') {
          throw new Error(
            'Library pembaca QR belum berhasil dimuat.'
          );
        }

        hentikanKamera();
        status.textContent = 'Meminta izin kamera...';

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        aktif = true;
        qrTerakhir = '';
        status.textContent =
          'Kamera aktif. Arahkan QR peserta ke kamera.';
        requestAnimationFrame(pindai);

      } catch (e) {
        aktif = false;
        status.textContent =
          'GAGAL: ' + e.name + ' — ' + e.message;
      }
    };

    function pindai() {
      if (!aktif || sedangMemproses) return;

      if (video.readyState >= 2 &&
          video.videoWidth > 0 &&
          video.videoHeight > 0) {
        sedangMemproses = true;

        try {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          ctx.drawImage(
            video, 0, 0, canvas.width, canvas.height
          );

          const gambar = ctx.getImageData(
            0, 0, canvas.width, canvas.height
          );

          const kode = jsQR(
            gambar.data,
            gambar.width,
            gambar.height,
            { inversionAttempts: 'attemptBoth' }
          );

          if (kode && kode.data &&
              kode.data !== qrTerakhir) {
            qrTerakhir = kode.data;
            hasil.textContent = kode.data;
            status.textContent =
              'QR berhasil dibaca. Siap memeriksa data.';
          }
        } catch (e) {
          console.error(e);
        }

        sedangMemproses = false;
      }

      if (aktif) requestAnimationFrame(pindai);
    }

    function hentikanKamera() {
      aktif = false;

      if (stream) {
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
      }

      stream = null;
      video.srcObject = null;
    }

    document.getElementById('stop').onclick = function () {
      hentikanKamera();
      status.textContent = 'Kamera telah dimatikan.';
    };

    window.addEventListener('pagehide', hentikanKamera);
  </script>
  
<script>
const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzFtMhNUJWig-gODHASqm6gexGALNbeW1zJjpVpXxIRQiKtT0nIwgttzz6_Q4NUexwp/exec';

let sedangMemprosesQR = false;

function tampilkanHasilScan(pesan, berhasil = false) {
  // Buat elemen hasil bila belum ada.
  let hasil = document.getElementById('hasilScan');

  if (!hasil) {
    hasil = document.createElement('div');
    hasil.id = 'hasilScan';
    hasil.style.padding = '12px';
    hasil.style.marginTop = '12px';
    hasil.style.borderRadius = '8px';
    hasil.style.background = '#f1f5f9';
    hasil.style.color = '#111827';

    const kamera = document.querySelector('video');

    if (kamera && kamera.parentElement) {
      kamera.parentElement.appendChild(hasil);
    } else {
      document.body.appendChild(hasil);
    }
  }

  hasil.textContent = pesan;
  hasil.style.border = berhasil
    ? '1px solid #16a34a'
    : '1px solid #dc2626';
}

function kirimQRKeAppsScript(isiQR) {
  if (sedangMemprosesQR) return;

  const bagian = String(isiQR || '').trim().split('|');

  if (bagian.length !== 2 ||
      !bagian[0].trim() ||
      !bagian[1].trim()) {
    tampilkanHasilScan(
      'QR tidak sesuai format ID_PESERTA|TOKEN_QR.'
    );
    return;
  }

  const id = bagian[0].trim();
  const token = bagian[1].trim();

  sedangMemprosesQR = true;
  tampilkanHasilScan('Memvalidasi peserta...');

  const namaCallback =
    'hasilScanCallback_' +
    Date.now() + '_' +
    Math.random().toString(36).slice(2);

  let script = null;
  let timeout = null;

  function bersihkan() {
    if (timeout) clearTimeout(timeout);
    if (script) script.remove();

    try {
      delete window[namaCallback];
    } catch (_) {
      window[namaCallback] = undefined;
    }

    sedangMemprosesQR = false;
  }

  window[namaCallback] = function(data) {
    bersihkan();

    if (!data || !data.sukses) {
      tampilkanHasilScan(
        data && data.pesan
          ? data.pesan
          : 'Validasi gagal. Silakan coba kembali.'
      );
      return;
    }

    tampilkanHasilScan(
      (data.nama ? data.nama + ' — ' : '') +
      data.pesan +
      (data.waktu ? ' Waktu: ' + data.waktu : ''),
      true
    );
  };

  const params = new URLSearchParams({
    action: 'scanAttendance',
    id: id,
    token: token,
    callback: namaCallback
  });

  script = document.createElement('script');
  script.src = APPS_SCRIPT_URL + '?' + params.toString();

  script.onerror = function() {
    bersihkan();
    tampilkanHasilScan(
      'Tidak dapat menghubungi Apps Script. Periksa deployment dan koneksi.'
    );
  };

  timeout = setTimeout(function() {
    bersihkan();
    tampilkanHasilScan(
      'Permintaan terlalu lama. Periksa koneksi dan deployment Apps Script.'
    );
  }, 20000);

  document.head.appendChild(script);
}
</script>

</body>
</html>
